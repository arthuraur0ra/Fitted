<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build a five-piece outfit, say what each piece is made of and where it came from, guess how sustainable it is, then see the facts.">
<style>
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  img{max-width:100%}
</style>
<title>Fitted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pacifico&display=swap">
<style>
/* Layout: a resale-app shell. Five pages, one per piece of the outfit: a feed of item cards, then listing-style details. One guess, then donut charts. */
:root{
  --bg:#FFFFFF;
  --surface:#F3F5F5;
  --ink:#141616;
  --muted:#6C7272;
  --line:#E2E5E5;
  --accent:#0D7C84;        /* resale-app teal */
  --on-accent:#FFFFFF;
  --accent-soft:#E2F1F1;
  --accent-ink:#0A666D;
  --c-second:#0D7C84; --c-new:#D2553F; --c-hand:#7A5BC2; --c-renew:#B07A0E;
  --c-plant:#4E9A5E; --c-animal:#8B5A3C; --c-synth:#5B6BC9; --c-blend:#8A9198; --c-metal:#B08A1E;
  --hi:#0D7C84; --md:#B07A0E; --lo:#D2553F;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121414; --surface:#1C1F1F; --ink:#ECEEEE; --muted:#9BA1A1; --line:#2B3030;
    --accent:#3DB6BE; --on-accent:#05282A; --accent-soft:#103133; --accent-ink:#72D3D9;
    --c-second:#3DB6BE; --c-new:#FF7A63; --c-hand:#B49AF0; --c-renew:#F0B23E;
    --c-plant:#6CC27C; --c-animal:#C98E67; --c-synth:#8E9BF0; --c-blend:#A9B0B7; --c-metal:#E0C25E;
    --hi:#3DB6BE; --md:#F0B23E; --lo:#FF7A63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121414; --surface:#1C1F1F; --ink:#ECEEEE; --muted:#9BA1A1; --line:#2B3030;
  --accent:#3DB6BE; --on-accent:#05282A; --accent-soft:#103133; --accent-ink:#72D3D9;
  --c-second:#3DB6BE; --c-new:#FF7A63; --c-hand:#B49AF0; --c-renew:#F0B23E;
  --c-plant:#6CC27C; --c-animal:#C98E67; --c-synth:#8E9BF0; --c-blend:#A9B0B7; --c-metal:#E0C25E;
  --hi:#3DB6BE; --md:#F0B23E; --lo:#FF7A63;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin-inline:auto;padding-block:0 32px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.screen{display:flex;flex-direction:column;gap:18px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.appbar-row{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;letter-spacing:-.01em;flex:1;min-width:0}
.brand svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-radius:50%;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar-title{font-weight:700;font-size:1rem;flex:1;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer;min-height:36px}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip[aria-current="step"],input:checked + .chip{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
input:focus-visible + .chip{outline:2px solid var(--accent);outline-offset:2px}
.tick{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chip .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* page */
.banner{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;margin-top:14px}
.banner h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.page-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.page-h h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:5px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.photo{position:relative;display:grid;place-items:center;aspect-ratio:4/5;width:100%;max-width:100%;border-radius:6px;background:var(--tint);overflow:hidden}
.photo svg.garment{width:58%;height:auto;stroke:#2A2A2A;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.heart svg{width:18px;height:18px;stroke:#3A3A3A;fill:none;stroke-width:2;stroke-linejoin:round}
.card[aria-pressed="true"] .heart svg{fill:var(--accent);stroke:var(--accent)}
.card[aria-pressed="true"] .photo{box-shadow:inset 0 0 0 2.5px var(--accent)}
.badge{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:4px}
.card-title{font-weight:600;font-size:.92rem}
.card-meta{font-size:.78rem;color:var(--muted)}

/* listing details */
.listing{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:120px}
.listing-head{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.listing-photo{position:relative;display:grid;place-items:center;width:84px;aspect-ratio:4/5;border-radius:6px;overflow:hidden}
.listing-photo .disc{width:72%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.listing-photo .disc svg{width:70%;height:auto;stroke:#2A2A2A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.listing-head h3{font-size:1.2rem;font-weight:800}
.drow{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;margin:0;padding-inline:0;min-width:0}
.drow-head{display:flex;justify-content:space-between;gap:12px}
.dlabel{color:var(--muted);font-size:.86rem}
.dvalue{font-weight:600;font-size:.9rem;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.sg{display:flex;flex-direction:column;gap:6px}
.sg + .sg{margin-top:8px}
.sg-h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wearbars{display:flex;flex-direction:column;gap:9px}
.wb{display:grid;grid-template-columns:64px minmax(0,1fr) 2ch;gap:10px;align-items:center;font-size:.88rem}
.wb .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.wb .fill{height:100%;background:var(--accent);border-radius:5px}
.wb .c{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* bottom bar */
.bottombar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;background:var(--bg);border-top:1px solid var(--line);margin-inline:-16px;margin-top:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bb-info{flex:1;min-width:0;font-size:.82rem;color:var(--muted);line-height:1.25}
.bb-info strong{display:block;color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 22px;min-height:46px;cursor:pointer;flex:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.full{width:100%}

/* guess */
.guess-card{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.guess-card h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{width:46px;height:56px;border-radius:5px;display:grid;place-items:center;flex:none}
.thumb .disc{width:80%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;display:grid;place-items:center}
.thumb svg{width:72%;height:auto;stroke:#2A2A2A;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.big-out{font-size:4.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-out small{font-size:1.4rem;color:var(--muted);font-weight:700;letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.ticks{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

/* results */
.panel{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:1rem;font-weight:800}
.chart-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:min(170px,46vw);height:auto;flex:none}
.donut .d-main{fill:var(--ink);font-family:var(--f-body);font-weight:800;font-size:19px}
.donut .d-sub{fill:var(--muted);font-family:var(--f-body);font-size:6.5px;font-weight:700;letter-spacing:.4px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.legend .sw-dot{width:12px;height:12px;border-radius:3px}
.legend .pct{font-weight:700;font-variant-numeric:tabular-nums}
.legend .zero{color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs div{background:var(--surface);border-radius:8px;padding:12px}
.vs .k{font-size:.78rem;color:var(--muted);font-weight:600}
.vs .v{font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.verdict{font-weight:800;font-size:1.15rem}
.scale{position:relative;height:28px;margin-top:2px}
.scale .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.scale .mk{position:absolute;top:5px;width:18px;height:18px;margin-left:-9px;border-radius:50%}
.scale .g{border:2.5px solid var(--muted);background:var(--bg)}
.scale .r{background:var(--accent)}
.scale-key{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.scale-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.scale-key .kg{border:2px solid var(--muted)}
.scale-key .kr{background:var(--accent)}
.insight{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.insight .k{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.cite{font-size:.76rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows > li{border-bottom:1px solid var(--line);padding:12px 0}
.rows > li:last-child{border-bottom:0}
.r-main{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center}
.r-main .thumb{width:48px;height:58px}
.r-name{font-weight:700}
.tip{margin-top:8px;display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:600;color:var(--accent-ink);line-height:1.35}
.tip-alt{font-weight:500;color:var(--muted)}
.real-note{font-size:.78rem;color:var(--muted);margin-top:2px}
.pill{font-weight:800;font-size:.86rem;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.hi{background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi)}
.pill.md{background:color-mix(in srgb,var(--md) 18%,transparent);color:var(--md)}
.pill.lo{background:color-mix(in srgb,var(--lo) 16%,transparent);color:var(--lo)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--accent-ink)}
.why{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:.88rem}
.why .k{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prompts,.sources{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.sources{font-size:.8rem;color:var(--muted);gap:6px}
.rules{display:flex;flex-direction:column;gap:8px;font-size:.92rem}

/* resale-app pieces */
.brand{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:1.7rem;color:var(--accent);letter-spacing:0;line-height:1.2}
.brand svg{display:none}
:root{--star:#D99A06}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--star:#F0B23E}}
:root[data-theme="dark"]{--star:#F0B23E}
.appbar.slim{padding-bottom:10px}
.appbar:not(.slim){padding-bottom:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:8px;padding:0 12px;height:40px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);height:100%}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--accent)}
.tabs{gap:22px}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 0 10px;font-weight:600;font-size:.93rem;color:var(--muted);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.tab[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab-tick{color:var(--accent-ink);font-size:.8rem}
.fav{position:absolute;right:8px;bottom:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fav svg{width:16px;height:16px;stroke:#3A3A3A;fill:none;stroke-width:2;stroke-linejoin:round}
.card[aria-pressed="true"] .fav svg{fill:var(--accent);stroke:var(--accent)}
.photo .badge{top:8px;bottom:auto}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0;text-align:center}
.item-hero{position:relative;display:grid;place-items:center;height:min(92vw,420px);margin-inline:-16px;overflow:hidden}
.item-hero .disc{width:min(44%,180px);aspect-ratio:1;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.item-hero .disc svg{width:66%;height:auto;stroke:#2A2A2A;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.swatch-label{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);color:#1A1A1A;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:4px}
.item-title{display:flex;flex-direction:column;gap:2px}
.item-title h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.dtable{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dtable div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.dtable dt{color:var(--muted)}
.dtable dd{margin:0;font-weight:600;text-align:right}
.pick{border:0;margin:0;padding:0;min-width:0}
.pick legend{font-weight:800;font-size:1rem;padding:0;margin-bottom:10px}
.btn.outline{background:var(--bg);color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn.grow{flex:1}
.profile{display:flex;align-items:center;gap:14px;margin-top:14px}
.avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none}
.avatar .disc{width:78%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;display:grid;place-items:center}
.avatar svg{width:70%;height:auto;stroke:#2A2A2A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile h2{font-size:1.3rem;font-weight:800}
.rating{display:flex;align-items:center;gap:8px;margin-top:4px}
.rating b{font-variant-numeric:tabular-nums}
.stars{position:relative;display:inline-block;font-size:1.1rem;letter-spacing:2px;line-height:1}
.stars .bg{color:var(--line)}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star)}

/* fabric swatches: fixed fabric colours, they read the same in either theme */
.sw-leather{background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.10) 0 1px,transparent 1.5px) 0 0/6px 6px,radial-gradient(circle at 70% 70%,rgba(0,0,0,.18) 0 1px,transparent 1.5px) 0 0/5px 5px,linear-gradient(135deg,#7E4B2C,#4B2915)}
.sw-blackleather{background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.08) 0 1px,transparent 1.5px) 0 0/6px 6px,linear-gradient(135deg,#3A3533,#191615)}
.sw-suede{background:radial-gradient(circle,rgba(255,255,255,.12) 0 .8px,transparent 1.2px) 0 0/3px 3px,linear-gradient(150deg,#A87A52,#8A5E3A)}
.sw-faux{background:linear-gradient(115deg,transparent 47%,rgba(255,255,255,.35) 48%,transparent 50%),linear-gradient(160deg,#2E2E32 0%,#5B5C63 42%,#25252A 56%,#151517 100%)}
.sw-fur{background:repeating-linear-gradient(100deg,rgba(255,255,255,.10) 0 1px,transparent 1px 3px),repeating-linear-gradient(80deg,rgba(0,0,0,.18) 0 1px,transparent 1px 4px),linear-gradient(160deg,#7A5A44,#4E3727)}
.sw-fauxfur{background:repeating-linear-gradient(100deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px),repeating-linear-gradient(80deg,rgba(0,0,0,.08) 0 1px,transparent 1px 4px),linear-gradient(160deg,#E8D9CC,#CDB8A6)}
.sw-cotton{background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 1px,transparent 1px 3px),#F1F1EC}
.sw-pique{background:radial-gradient(circle,rgba(0,0,0,.10) 0 1px,transparent 1.4px) 0 0/4px 4px,#F3F3EE}
.sw-organic{background:radial-gradient(circle,rgba(120,95,60,.35) 0 1px,transparent 1.4px) 0 0/8px 8px,repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),#E4DBC6}
.sw-rcotton{background:radial-gradient(circle,rgba(200,60,60,.55) 0 1px,transparent 1.5px) 0 0/9px 9px,radial-gradient(circle,rgba(40,80,160,.5) 0 1px,transparent 1.5px) 4px 5px/11px 11px,radial-gradient(circle,rgba(0,0,0,.25) 0 1px,transparent 1.5px) 2px 2px/6px 6px,#D9D7D2}
.sw-marl{background:radial-gradient(circle,rgba(255,255,255,.25) 0 1px,transparent 1.5px) 0 0/4px 4px,radial-gradient(circle,rgba(0,0,0,.18) 0 1px,transparent 1.5px) 2px 2px/5px 5px,#8E9297}
.sw-poly{background:linear-gradient(120deg,#B92D4D 0%,#EE7A92 38%,#C4375A 55%,#9E2340 100%)}
.sw-mesh{background:radial-gradient(circle,rgba(0,0,0,.28) 0 1px,transparent 1.6px) 0 0/5px 5px,linear-gradient(120deg,#1F6F4A 0%,#38A06E 40%,#1D6A46 60%,#155238 100%)}

<main class="wrap">

    polyel:{name:'Polyester + elastane', cat:'synthetic', sw:'stretchjersey', n:1, l:2,

  /* ---------- the five pages ---------- */
  const SNEAK_NOTE = 'Most sneakers have glued soles that can\'t be replaced, so they wear out when the sole goes.';
  const STEPS = [
    {key:'jacket', label:'Jacket', title:'Pick a jacket', items:[

      {id:'ankle', name:'Ankle boots', tint:'#EDE6DF', note:'Leather boots can often be resoled by a cobbler.', mats:[{m:'leather'}, {m:'suede'}, {m:'faux'}]},
      {id:'knee', name:'Knee-high boots', tint:'#ECE5E9', mats:[{m:'leather', sw:'blackleather'}, {m:'suede'}, {m:'faux'}]},
      {id:'heels', name:'Heels', tint:'#F2E6EA', note:'A cobbler can replace worn heel tips and soles.', mats:[{m:'leather', sw:'blackleather', l:3}, {m:'satin'}, {m:'faux'}]},
      {id:'loafers', name:'Loafers', tint:'#E9E6E0', mats:[{m:'leather'}, {m:'suede'}, {m:'faux'}]},
      {id:'flats', name:'Ballet flats', tint:'#F3EAE6', mats:[{m:'leather', l:3}, {m:'satin'}, {m:'faux'}]}
    ]},
    {key:'extra', label:'Extra', title:'Pick a bag or accessory', items:[
      {id:'shoulder', name:'Shoulder bag', tint:'#F1E8E2', mats:[{m:'leather'}, {m:'faux'}, {m:'nylon'}]},
      {id:'tote', name:'Tote bag', tint:'#F2EEE2', mats:[{m:'canvas', l:3, life:'A sturdy canvas tote can last years and be patched or washed.'}, {m:'leather'}, {m:'rpet'}]},
      {id:'backpack', name:'Backpack', tint:'#E3E9EF', mats:[{m:'nylon'}, {m:'polyester'}, {m:'rpet'}]},
      {id:'cap', name:'Cap', tint:'#E8ECE0', mats:[{m:'twill'}, {m:'polyester'}]},
      {id:'beanie', name:'Beanie', tint:'#ECEFE4', mats:[{m:'wool', sw:'knitwool'}, {m:'cotton', sw:'cottonknit'}, {m:'acrylic'}]},
      {id:'necklace', name:'Necklace', tint:'#EEEEF0', mats:[{m:'silver'}, {m:'goldplated'}, {m:'steel'}]},
      {id:'bracelet', name:'Bracelet', tint:'#F0EEE8', mats:[{m:'silver'}, {m:'goldplated'}, {m:'steel'}, {m:'leather'}]},
      {id:'belt', name:'Belt', tint:'#EDE6DF', mats:[{m:'leather'}, {m:'faux'}, {m:'canvas', l:3, life:'Canvas webbing is tough and easy to keep going.'}]}
    ]}
  ];

  /* Where it came from. BASE turns the material's points into the piece's starting score. */
  const SOURCES = [
    {id:'highstreet', group:'new', name:'High street shop',
     fact:'Bought new, so all of the making footprint is on your account. Making a garment is the biggest part of its footprint.', src:'Levänen et al. (2021)'},
    {id:'fastapp', group:'new', name:'Fast-fashion app',
     fact:'Ultra-cheap online fashion is built for speed and volume, and it arrives in a parcel. A 2025 US study reported a 24.6% rise in ultra-fast-fashion purchases between 2020 and 2024.', src:'Peleg Mizrachi & Sharon (2025)'},
    {id:'brand', group:'new', name:'Brand or designer',
     fact:'A higher price doesn\'t change how the fabric was made, so it scores like any new piece. What can change is how many times you wear it.'},
    {id:'charity', group:'second', name:'Charity or thrift shop',
     fact:'Its making footprint already happened, and buying in person means no parcel or packaging.'},
    {id:'resale', group:'second', name:'Resale app',
     fact:'Second-hand, but posted to you with packaging. Resale apps are also built to keep you browsing, and in a US survey the heaviest second-hand buyers also bought the most new clothes.', src:'Peleg Mizrachi & Sharon (2025)'},
    {id:'vintage', group:'second', name:'Vintage shop or market',
     fact:'An older piece that has already proven it lasts, bought in person with no new production.'},
    {id:'hand', group:'free', name:'Hand-me-down',
     fact:'Passed on by family or friends: no new production and nothing to ship. Pieces with a story attached also tend to be kept longer.', src:'Belk (1988)'},
    {id:'swap', group:'free', name:'Swapped',
     fact:'Swapped with a friend or at a swap event: no new production, no money and usually no parcel.'},
    {id:'repaired', group:'renew', name:'Owned it, repaired it',
     fact:'Fixing something you already own keeps it in use for longer, which life-cycle research ranks as the lowest-impact option.', src:'Levänen et al. (2021)'},
    {id:'upcycled', group:'renew', name:'Upcycled or remade',
     fact:'Remade from old clothes or offcuts, so no new fibre is needed. It takes some new thread and work.'}
  ];
  const BASE = {
    highstreet:p => p.n, fastapp:p => Math.max(0, p.n - 1), brand:p => p.n,
    charity:p => 5 + p.l, resale:p => 4 + p.l, vintage:p => 5 + p.l,
    hand:p => 6 + p.l, swap:p => 6 + p.l,
    repaired:p => 6 + p.l, upcycled:p => 5 + p.l
  };
  const GROUPS = [
    {id:'new', name:'New', color:'--c-new'},
    {id:'second', name:'Second-hand', color:'--c-second'},
    {id:'free', name:'Free', color:'--c-hand'},
    {id:'renew', name:'Repaired or remade', color:'--c-renew'}
  ];
  const WEARS = [
    {id:'w1', name:'Under 5', mod:-2,
     fact:'With fewer than 5 wears, the making footprint is spread over very few outings. Globally, the number of times a garment is worn has fallen by 36% in 15 years.', src:'Ellen MacArthur Foundation (2017)'},
    {id:'w2', name:'5–14', mod:-1, fact:'5 to 14 wears is a short life for a garment.'},
    {id:'w3', name:'15–29', mod:0, fact:'15 to 29 wears is a fair run.'},
    {id:'w4', name:'30+', mod:1,
     fact:'30 or more wears spreads the footprint thin. Wearing clothes for longer is the simplest way to cut their impact.', src:'Levänen et al. (2021)'}
  ];
  const MAT_CATS = [
    {id:'plant', name:'Plant fibre', color:'--c-plant'},
    {id:'animal', name:'Animal-derived', color:'--c-animal'},
    {id:'synthetic', name:'Synthetic', color:'--c-synth'},
    {id:'blend', name:'Blend', color:'--c-blend'},
    {id:'metal', name:'Metal', color:'--c-metal'}
  ];

  /* ---------- scoring ---------- */
  const itemOf = (step, id) => STEPS[step].items.find(i => i.id === id);
  const optOf = (item, m) => item.mats.find(o => o.m === m);
  const pts = (item, m) => { const o = optOf(item, m), d = MATS[m]; return {n:o.n ?? d.n, l:o.l ?? d.l}; };
  const swOf = (item, m) => { const o = optOf(item, m); return (o && o.sw) || MATS[m].sw; };
  const srcOf = id => SOURCES.find(s => s.id === id);
  const wearOf = id => WEARS.find(w => w.id === id);
  const isNew = id => srcOf(id).group === 'new';
  function scoreOf(item, m, src, wear){
    const base = BASE[src](pts(item, m));
    return Math.max(0, Math.min(10, base + wearOf(wear).mod));
  }

  const fresh = () => ({screen:'build', step:0, picks:STEPS.map(() => ({item:null, mat:null, src:null, wear:null})), guess:5, view:'grid', q:''});
  let S = fresh();
  const complete = p => !!(p.item && p.mat && p.src && p.wear);

  const SCREENS = ['build','guess','result'];
  function show(name){
    S.screen = name;
    SCREENS.forEach(n => { document.getElementById('screen-' + n).hidden = n !== name; });
    window.scrollTo({top:0});
  }

  /* ---------- build pages ---------- */
  const BRAND_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6a2 2 0 1 1 2 2c-1 0-2 .7-2 1.7V10l9 6.5c.8.6.4 1.5-.5 1.5h-17c-.9 0-1.3-.9-.5-1.5L12 10"/></svg>';
  const BACK_SVG = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
  const SEARCH_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
  const PLURAL = {jacket:'jackets', top:'tops', bottoms:'bottoms', shoes:'shoes', extra:'bags and accessories'};

  const reachable = () => { const f = S.picks.findIndex(p => !complete(p)); return f === -1 ? STEPS.length - 1 : f; };

  function thumbHTML(step, cls){
    const p = S.picks[step], item = itemOf(step, p.item);
    const sw = p.mat ? 'sw-' + swOf(item, p.mat) : '';
    return `<span class="${cls} ${sw}" ${p.mat ? '' : `style="background:${item.tint}"`}><span class="disc">${svgIcon(item.id)}</span></span>`;
  }

  function renderBuild(){
    const p = S.picks[S.step];
    if (S.view === 'item' && p.item) renderItemView();
    else renderGridView();
  }

  /* the feed for one step */
  function renderGridView(){
    S.view = 'grid';
    const st = STEPS[S.step], p = S.picks[S.step], reach = reachable();
    $('#build-appbar').className = 'appbar';
    $('#build-appbar').innerHTML = `
      <div class="appbar-row"><div class="brand">Fitted</div><span class="small muted">${S.picks.filter(complete).length}/${STEPS.length} in outfit</span></div>
      <label class="search" for="search">${SEARCH_SVG}<input id="search" type="search" placeholder="Search ${PLURAL[st.key]}" autocomplete="off" value="${esc(S.q)}"></label>
      <nav class="tabs" aria-label="Outfit steps">${STEPS.map((s, i) => `<button type="button" class="tab" data-step="${i}" ${i === S.step ? 'aria-current="step"' : ''} ${i > reach ? 'disabled' : ''}>${s.label}${complete(S.picks[i]) ? '<span class="tab-tick" aria-label="done">✓</span>' : ''}</button>`).join('')}</nav>`;
    $('#build-body').innerHTML = `
      ${S.step === 0 ? `<div class="banner"><h1>Build an outfit</h1><p>Five pieces you'd actually wear: a jacket, a top, bottoms, shoes and one extra. Tap a piece to set what it's made of, where it came from and how often you'll wear it.</p></div>` : ''}
      <div class="page-h"><h2>${st.title}</h2><span class="small muted" id="count"></span></div>
      <div class="grid" id="grid"></div>`;
    renderGrid();
    const item = p.item ? itemOf(S.step, p.item) : null;
    $('#build-bar').innerHTML = `
      <div class="bb-info"><strong>${complete(p) ? item.name : st.label}</strong>${complete(p) ? 'In your outfit' : 'Tap a piece to open it'}</div>
      <button class="btn" id="continue" type="button" ${complete(p) ? '' : 'disabled'}>${S.step === STEPS.length - 1 ? 'Rate my outfit' : 'Continue'}</button>`;
  }

  function renderGrid(){
    const st = STEPS[S.step], p = S.picks[S.step], q = S.q.trim().toLowerCase();
    const list = st.items.filter(i => !q || i.name.toLowerCase().includes(q) || i.mats.some(o => MATS[o.m].name.toLowerCase().includes(q)));
    $('#count').textContent = `${list.length} ${list.length === 1 ? 'piece' : 'pieces'}`;
    $('#grid').innerHTML = list.length ? list.map(i => {
      const on = p.item === i.id && complete(p);
      return `<button type="button" class="card" data-id="${i.id}" aria-pressed="${on}">
        <span class="photo" style="--tint:${i.tint}">${svgIcon(i.id, 'garment')}
          ${on ? '<span class="badge">In outfit</span>' : ''}
          <span class="fav">${HEART_SVG}</span></span>
        <span class="card-title">${i.name}</span>
        <span class="card-meta">${i.mats.map(o => MATS[o.m].name).slice(0, 2).join(', ')}${i.mats.length > 2 ? ` +${i.mats.length - 2}` : ''}</span>
      </button>`;
    }).join('') : `<p class="empty">Nothing matches "${esc(S.q)}".</p>`;
  }

  /* the item page */
  function renderItemView(){
    const st = STEPS[S.step], p = S.picks[S.step], item = itemOf(S.step, p.item);
    $('#build-appbar').className = 'appbar slim';
    $('#build-appbar').innerHTML = `
      <div class="appbar-row"><button class="iconbtn" id="item-back" type="button" aria-label="Back to ${PLURAL[st.key]}">${BACK_SVG}</button>
        <span class="bar-title">${item.name}</span><span class="small muted">${S.step + 1} of ${STEPS.length}</span></div>`;
    const sw = p.mat ? 'sw-' + swOf(item, p.mat) : '';
    $('#build-body').innerHTML = `
      <div class="item-hero ${sw}" ${p.mat ? '' : `style="background:${item.tint}"`}>
        <span class="disc">${svgIcon(item.id)}</span>
        ${p.mat ? `<span class="swatch-label">${MATS[p.mat].name}</span>` : ''}
      </div>
      <div class="item-title"><h2>${item.name}</h2><p class="muted">${st.label}</p></div>
      <dl class="dtable">
        <div><dt>Category</dt><dd>${st.label}</dd></div>
        <div><dt>Material</dt><dd>${p.mat ? MATS[p.mat].name : '<span class="muted">Not set</span>'}</dd></div>
        <div><dt>Where from</dt><dd>${p.src ? srcOf(p.src).name : '<span class="muted">Not set</span>'}</dd></div>
        <div><dt>Wears</dt><dd>${p.wear ? wearOf(p.wear).name : '<span class="muted">Not set</span>'}</dd></div>
      </dl>
      <fieldset class="pick"><legend>Material</legend>
        <div class="chips">${item.mats.map(o => `
          <input class="vh" type="radio" name="mat" id="mat-${o.m}" value="${o.m}" ${p.mat === o.m ? 'checked' : ''}>
          <label class="chip" for="mat-${o.m}"><span class="dot sw-${o.sw || MATS[o.m].sw}" aria-hidden="true"></span>${MATS[o.m].name}</label>`).join('')}
        </div></fieldset>
      <fieldset class="pick"><legend>Where it came from</legend>
        ${GROUPS.map(g => `<div class="sg"><p class="sg-h">${g.name}</p><div class="chips">${SOURCES.filter(s => s.group === g.id).map(s => `
          <input class="vh" type="radio" name="src" id="src-${s.id}" value="${s.id}" ${p.src === s.id ? 'checked' : ''}>
          <label class="chip" for="src-${s.id}">${s.name}</label>`).join('')}</div></div>`).join('')}
      </fieldset>
      <fieldset class="pick"><legend>How many times will you wear it?</legend>
        <div class="chips">${WEARS.map(w => `
          <input class="vh" type="radio" name="wear" id="wear-${w.id}" value="${w.id}" ${p.wear === w.id ? 'checked' : ''}>
          <label class="chip" for="wear-${w.id}">${w.name}</label>`).join('')}
        </div></fieldset>`;
    const last = S.step === STEPS.length - 1;
    $('#build-bar').innerHTML = `
      <button class="btn outline" id="item-back2" type="button">Back</button>
      <button class="btn grow" id="add" type="button" ${complete(p) ? '' : 'disabled'}>${complete(p) ? (last ? 'Add and rate outfit' : 'Add to outfit') : !p.mat ? 'Choose a material' : !p.src ? 'Where did it come from?' : 'How often will you wear it?'}</button>`;
  }

  function toGrid(){ S.view = 'grid'; renderBuild(); window.scrollTo({top:0}); }
  function nextStep(){
    if (S.step < STEPS.length - 1) { S.step++; S.q = ''; S.view = 'grid'; renderBuild(); window.scrollTo({top:0}); }
    else { renderGuess(); show('guess'); }
  }

  $('#build-appbar').addEventListener('click', e => {
    const t = e.target.closest('[data-step]');
    if (t && !t.disabled) { S.step = Number(t.dataset.step); S.q = ''; toGrid(); return; }
    if (e.target.closest('#item-back')) toGrid();
  });
  $('#build-appbar').addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value; renderGrid(); } });
  $('#build-body').addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c) return;
    const p = S.picks[S.step], id = c.dataset.id;
    if (p.item !== id) { const item = itemOf(S.step, id); p.item = id; if (!p.mat || !optOf(item, p.mat)) p.mat = null; }
    S.view = 'item'; renderBuild(); window.scrollTo({top:0});
  });
  $('#build-body').addEventListener('change', e => {
    const t = e.target, p = S.picks[S.step];
    if (t.name === 'mat') p.mat = t.value;
    if (t.name === 'src') p.src = t.value;
    if (t.name === 'wear') p.wear = t.value;
    const keep = t.id;
    renderBuild();
    const f = document.getElementById(keep); if (f) f.focus({preventScroll:true});
  });
  $('#build-bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.id === 'continue' || b.id === 'add') nextStep();
    if (b.id === 'item-back2') toGrid();
  });

  /* ---------- guess ---------- */
  function renderGuess(){
    $('#guess-thumbs').innerHTML = STEPS.map((_, i) => thumbHTML(i, 'thumb')).join('');
    $('#guess').value = S.guess;
    $('#guess-out').innerHTML = `${S.guess}<small>/10</small>`;
  }
  $('#guess').addEventListener('input', e => { S.guess = Number(e.target.value); $('#guess-out').innerHTML = `${S.guess}<small>/10</small>`; });
  $('#guess-back').addEventListener('click', () => { S.step = STEPS.length - 1; S.view = 'item'; renderBuild(); show('build'); });
  $('#guess-go').addEventListener('click', () => { renderResult(); show('result'); });

  /* ---------- results ---------- */
  function pcts(counts, total){
    const raw = counts.map(c => c / total * 100), base = raw.map(Math.floor);
    let left = 100 - base.reduce((a, b) => a + b, 0);
    raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && counts[i] > 0) { base[i]++; left--; } });
    return base;
  }
  function donut(parts, main, sub, label){
    const r = 40, C = 2 * Math.PI * r, total = parts.reduce((a, p) => a + p.value, 0);
    const live = parts.filter(p => p.value > 0), gap = live.length > 1 ? 1.4 : 0;
    let off = 0;
    const segs = live.map(p => {
      const len = p.value / total * C;
      const s = `<circle cx="50" cy="50" r="${r}" fill="none" style="stroke:var(${p.color})" stroke-width="15" stroke-dasharray="${(len - gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`;
      off += len; return s;
    }).join('');
    return `<svg class="donut" viewBox="0 0 100 100" role="img" aria-label="${label}">
      <circle cx="50" cy="50" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="15"/>${segs}
      <text x="50" y="52" text-anchor="middle" class="d-main">${main}</text>
      <text x="50" y="63" text-anchor="middle" class="d-sub">${sub}</text></svg>`;
  }
  const legend = (parts, pc) => `<ul class="legend">${parts.map((p, i) => `<li class="${p.value ? '' : 'zero'}"><span class="sw-dot" style="background:var(${p.color})"></span><span>${p.name}</span><span class="pct">${pc[i]}%</span></li>`).join('')}</ul>`;

  /* Best single changes for one piece: buy it second-hand in person, pick a better material, or wear it more. */
  const KIND_ORDER = {wear:0, src:1, mat:2};
  function suggest(r){
    const {item, p} = r, cur = r.sc, opts = [];
    if (cur >= 10) return [];
    if (p.src !== 'charity') {
      const s = scoreOf(item, p.mat, 'charity', p.wear);
      if (s > cur) opts.push({kind:'src', gain:s - cur, to:s, text:'Get it from a charity or thrift shop instead'});
    }
    const mats = item.mats.filter(o => !MATS[o.m].noSuggest && o.m !== p.mat)
      .map(o => ({m:o.m, s:scoreOf(item, o.m, p.src, p.wear)})).sort((a, b) => b.s - a.s);
    if (mats.length && mats[0].s > cur) opts.push({kind:'mat', gain:mats[0].s - cur, to:mats[0].s, text:`Choose ${MATS[mats[0].m].name.toLowerCase()} instead of ${MATS[p.mat].name.toLowerCase()}`});
    if (p.wear !== 'w4') {
      const s = scoreOf(item, p.mat, p.src, 'w4');
      if (s > cur) opts.push({kind:'wear', gain:s - cur, to:s, text:'Wear it 30+ times'});
    }
    return opts.sort((a, b) => b.gain - a.gain || KIND_ORDER[a.kind] - KIND_ORDER[b.kind]);
  }

  function insights(guess, avg, rows){
    const d = guess - Math.round(avg), out = [];
    const haloNew = [...new Set(rows.filter(r => isNew(r.p.src) && MATS[r.p.mat].halo).map(r => MATS[r.p.mat].halo))];
    if (d > 1) {
      out.push({k:'You rated it higher than it scored', t:'Most of us feel our clothes are greener than they are. That\'s the attitude–behaviour gap: what we believe and what we buy don\'t line up.', src:'Busalim et al. (2022)'});
      if (haloNew.length) out.push({k:'Halo effect', t:`Words like "${haloNew.join('", "')}" on new pieces may have pulled your guess up. One appealing label can make a whole product seem better than it is.`, src:'Nisbett & Wilson (1977)'});
    } else if (d < -1) {
      out.push({k:'You were harder on yourself than the evidence', t:'Pieces that already existed carry very little new impact, so second-hand and hand-me-downs count for more than people expect.'});
    } else {
      out.push({k:'Good read', t:'Your guess was within a point of your real score. You judged your outfit on where things came from, not just on the labels.'});
    }
    const n = rows.length, sec = rows.filter(r => srcOf(r.p.src).group === 'second').length, nw = rows.filter(r => isNew(r.p.src)).length;
    const short = rows.filter(r => r.p.wear === 'w1').length;
    if (short >= 2) out.push({k:'Short lives', t:`${short} of your pieces will be worn fewer than 5 times. Globally, the number of times a garment is worn has fallen by 36% in 15 years.`, src:'Ellen MacArthur Foundation (2017)'});
    if (sec / n >= 0.5) out.push({k:'Watch out for moral licensing', t:'Lots of second-hand here. In a US survey, the heaviest second-hand buyers also bought the most new clothes, as if each good buy "earned" another.', src:'Peleg Mizrachi & Sharon (2025)'});
    else if (nw / n >= 0.5) out.push({k:'Where your points went', t:'Most of your pieces were bought new. Making clothes is the biggest part of their footprint, so new pieces score low whatever they\'re made of.', src:'Levänen et al. (2021)'});
    return out;
  }

  function renderResult(){
    const rows = STEPS.map((st, i) => { const p = S.picks[i], item = itemOf(i, p.item); return {i, st, p, item, sc:scoreOf(item, p.mat, p.src, p.wear)}; });
    const n = rows.length;
    const avg = Math.round(rows.reduce((a, r) => a + r.sc, 0) / n * 10) / 10;
    // Guesses are whole numbers, so the real score is rounded before comparing (8.2 counts as 8).
    const rounded = Math.round(avg);
    const diff = S.guess - rounded, ad = Math.abs(diff);
    const verdict = ad === 0 ? 'Correct' : ad === 1 ? 'Close' : ad <= 3 ? 'A bit off' : 'Way off';
    const dirText = ad === 0 ? `${avg.toFixed(1)} rounds to ${rounded}, so you got it.` : diff > 0 ? `You guessed ${ad} too high.` : `You guessed ${ad} too low.`;

    const tipsBy = rows.map(r => suggest(r));
    const best = rows.map((r, i) => ({r, t:tipsBy[i][0]})).filter(x => x.t).sort((a, b) => b.t.gain - a.t.gain)[0];
    const allSwaps = Math.round(rows.reduce((a, r, i) => a + (tipsBy[i][0] ? tipsBy[i][0].to : r.sc), 0) / n * 10) / 10;
    const winsHTML = best
      ? `<div class="panel"><h3>Your quickest wins</h3>
          <div class="insight"><p class="k">Biggest single win</p><p><strong>${best.r.item.name}:</strong> ${best.t.text.charAt(0).toLowerCase() + best.t.text.slice(1)}. That takes it from ${best.r.sc} to ${best.t.to}/10.</p></div>
          <p>Make the best change on every piece and your outfit would score <strong>${allSwaps.toFixed(1)}/10</strong> instead of ${avg.toFixed(1)}.</p></div>`
      : `<div class="panel"><h3>Your quickest wins</h3><p>Every piece already scores top marks. Keep them in use and repair them when they need it.</p></div>`;

    const srcParts = GROUPS.map(g => ({name:g.name, color:g.color, value:rows.filter(r => srcOf(r.p.src).group === g.id).length}));
    const wearRows = WEARS.map(w => ({name:w.name, value:rows.filter(r => r.p.wear === w.id).length}));
    const matParts = MAT_CATS.map(c => ({name:c.name, color:c.color, value:rows.filter(r => MATS[r.p.mat].cat === c.id).length}));
    const srcPc = pcts(srcParts.map(p => p.value), n), matPc = pcts(matParts.map(p => p.value), n);

    const itemRows = rows.map(r => {
      const m = MATS[r.p.mat], o = optOf(r.item, r.p.mat), s = srcOf(r.p.src), w = wearOf(r.p.wear);
      const fromNew = isNew(r.p.src);
      let matText = fromNew ? m.fact : (o.life || m.life);
      if (!fromNew && r.item.note) matText += ' ' + r.item.note;
      const matSrc = fromNew ? m.src : (o.life ? null : m.lsrc);
      const cls = r.sc >= 7 ? 'hi' : r.sc >= 4 ? 'md' : 'lo';
      const tp = tipsBy[r.i];
      const lower = t => t.charAt(0).toLowerCase() + t.slice(1);
      const tipHTML = r.sc >= 10
        ? '<p class="tip"><span aria-hidden="true">✓</span><span>Top marks. Keep it in use and repair it when it needs it.</span></p>'
        : tp.length
          ? `<p class="tip"><span aria-hidden="true">↑</span><span>${tp[0].text}: ${r.sc} → ${tp[0].to}/10${tp[1] ? `<span class="tip-alt"> · or ${lower(tp[1].text)} (${tp[1].to}/10)</span>` : ''}</span></p>`
          : '<p class="tip"><span aria-hidden="true">✓</span><span>This is as good as this piece gets with these choices.</span></p>';
      return `<li>
        <div class="r-main">${thumbHTML(r.i, 'thumb')}
          <div><p class="r-name">${r.item.name}</p><p class="small muted">${m.name} · ${s.name} · ${w.name} wears</p></div>
          <span class="pill ${cls}">${r.sc}/10</span></div>
        ${tipHTML}
        <details><summary>Why this score</summary>
          <div class="why">
            <p class="k">${fromNew ? 'Making the material' : 'How long it will last'}</p><p>${matText}</p>${matSrc ? `<p class="cite">${matSrc}</p>` : ''}
            <p class="k">${s.name}</p><p>${s.fact}</p>${s.src ? `<p class="cite">${s.src}</p>` : ''}
            <p class="k">${w.name} wears (${w.mod > 0 ? '+' + w.mod : w.mod === 0 ? '±0' : w.mod})</p><p>${w.fact}</p>${w.src ? `<p class="cite">${w.src}</p>` : ''}
          </div></details>
      </li>`;
    }).join('');

    $('#result-body').innerHTML = `
      <div class="profile">${thumbHTML(0, 'avatar')}
        <div><h2>Your outfit</h2>
          <div class="rating"><span class="stars" role="img" aria-label="${(avg / 2).toFixed(1)} out of 5 stars"><span class="bg">★★★★★</span><span class="fg" style="width:${avg * 10}%">★★★★★</span></span><b>${avg.toFixed(1)}/10</b></div>
          <p class="small muted">5 pieces · Your guess: ${verdict.toLowerCase()}</p></div></div>

      <div class="panel">
        <h3>Where your outfit came from</h3>
        <div class="chart-row">
          ${donut(srcParts, avg.toFixed(1), 'OUT OF 10', `Outfit score ${avg} out of 10. Sources: ${srcParts.map((p, i) => p.name + ' ' + srcPc[i] + '%').join(', ')}`)}
          ${legend(srcParts, srcPc)}
        </div>
      </div>

      <div class="panel">
        <h3>Your guess</h3>
        <div class="vs"><div><p class="k">You guessed</p><p class="v">${S.guess}</p></div><div><p class="k">Real score</p><p class="v">${avg.toFixed(1)}</p><p class="real-note">Rounds to ${rounded}</p></div></div>
        <p class="verdict">${verdict}. <span class="muted" style="font-weight:600">${dirText}</span></p>
        <div>
          <div class="scale" aria-hidden="true"><span class="track"></span><span class="mk g" style="left:${S.guess * 10}%"></span><span class="mk r" style="left:${avg * 10}%"></span></div>
          <div class="scale-key"><span><i class="kg"></i>Your guess</span><span><i class="kr"></i>Real score</span></div>
        </div>
        ${insights(S.guess, avg, rows).map(t => `<div class="insight"><p class="k">${t.k}</p><p>${t.t}</p>${t.src ? `<p class="cite">${t.src}</p>` : ''}</div>`).join('')}
      </div>

      ${winsHTML}

      <div class="panel">
        <h3>What it's made of</h3>
        <div class="chart-row">
          ${donut(matParts, '5', 'PIECES', `Materials: ${matParts.map((p, i) => p.name + ' ' + matPc[i] + '%').join(', ')}`)}
          ${legend(matParts, matPc)}
        </div>
      </div>

      <div class="panel">
        <h3>How much you'll wear it</h3>
        <div class="wearbars">${wearRows.map(w => `<div class="wb"><span>${w.name}</span><span class="track"><span class="fill" style="width:${w.value / n * 100}%;display:block"></span></span><span class="c">${w.value}</span></div>`).join('')}</div>
        <p class="small muted">Number of pieces in each range of wears.</p>
      </div>

      <div class="panel">
        <h3>Piece by piece</h3>
        <ul class="rows">${itemRows}</ul>
      </div>

      <div class="panel">
        <h3>How the scoring works</h3>
        <div class="rules">
          <p><strong>New:</strong> 0 to 3 points, for the impact of making that material. A fast-fashion app takes one point off.</p>
          <p><strong>Second-hand:</strong> 5 points (4 from a resale app, for the parcel), plus 1 to 4 for how long the material will last and whether it can be repaired.</p>
          <p><strong>Free or repaired:</strong> hand-me-downs, swaps and repairs start at 6, upcycled pieces at 5, plus the same 1 to 4.</p>
          <p><strong>Wears:</strong> under 5 takes off 2, 5–14 takes off 1, 15–29 changes nothing, 30+ adds 1. Every piece stays between 0 and 10.</p>
          <p>Your outfit score is the average of your five pieces.</p>
          <p class="small muted">A simplified teaching model built from the sources below, not an official life-cycle assessment.</p>
        </div>
      </div>

      <div class="panel">
        <h3>Argue with the scoring</h3>
        <ol class="prompts">
          <li>New leather and new faux leather both score 1. Do you agree?</li>
          <li>A resale app scores a point below a charity shop, for the parcel and the nudge to keep buying. Fair?</li>
          <li>A designer piece scores the same as high street when new. Does a higher price buy sustainability?</li>
          <li>Second-hand real fur scores high here because it lasts and no new animal dies for it. Is that fair, or does wearing it still keep fur fashionable?</li>
          <li>Hand-me-downs and swaps beat buying second-hand. Is that fair to people with nobody to pass clothes on?</li>
          <li>Did a label like "organic", "recycled", "vegan" or "cruelty-free" change your guess?</li>
        </ol>
      </div>

      <div class="panel">
        <h3>Sources</h3>
        <ul class="sources">
          <li>Belk (1988). Possessions and the extended self. <a href="https://doi.org/10.1086/209154" target="_blank" rel="noopener">Journal of Consumer Research</a></li>
          <li>Busalim, Fox &amp; Lynn (2022). Consumer behavior in sustainable fashion. <a href="https://doras.dcu.ie/28158/" target="_blank" rel="noopener">International Journal of Consumer Studies</a></li>
          <li>Ellen MacArthur Foundation (2017). <a href="https://www.ellenmacarthurfoundation.org/a-new-textiles-economy" target="_blank" rel="noopener">A new textiles economy</a></li>
          <li>FashionUnited (2021). <a href="https://fashionunited.uk/news/business/panel-discussion-can-common-cotton-claims-be-debunked/2021011352948" target="_blank" rel="noopener">Can common cotton claims be debunked?</a></li>
          <li>Fur Farming (Prohibition) Act 2000. <a href="https://www.legislation.gov.uk/ukpga/2000/33/notes" target="_blank" rel="noopener">legislation.gov.uk</a></li>
          <li>Human Rights Watch (2013). <a href="https://www.hrw.org/news/2013/04/18/polluting-tanneries-bangladesh-face-fines" target="_blank" rel="noopener">Polluting tanneries in Bangladesh face fines</a></li>
          <li>Leather Naturally (2026). <a href="https://www.leathernaturally.org/wp-content/uploads/2026/03/Different-Types-of-Tanning-Factsheet-—-March-2026.pdf" target="_blank" rel="noopener">Different types of tanning factsheet</a></li>
          <li>Levänen et al. (2021). Innovative recycling or extended use? <a href="https://doi.org/10.1088/1748-9326/abfac3" target="_blank" rel="noopener">Environmental Research Letters</a></li>
          <li>Meyer, Dietrich, Schulz &amp; Mondschein (2021). Leather, artificial leather and trendy alternatives. <a href="https://doi.org/10.3390/coatings11020226" target="_blank" rel="noopener">Coatings</a></li>
          <li>MINING.COM (2025). <a href="https://www.mining.com/which-countries-produce-the-worlds-silver/" target="_blank" rel="noopener">Which countries produce the world's silver?</a></li>
          <li>Napper &amp; Thompson (2016). Microplastic fibres from domestic washing. <a href="https://www.plymouth.ac.uk/news/washing-clothes-releases-thousands-of-microplastic-particles-into-environment-study-shows" target="_blank" rel="noopener">University of Plymouth summary</a></li>
          <li>Nisbett &amp; Wilson (1977). The halo effect. <a href="https://doi.org/10.1037/0022-3514.35.4.250" target="_blank" rel="noopener">Journal of Personality and Social Psychology</a></li>
          <li>NPR (2016). <a href="https://www.kaxe.org/news/2016-12-09/how-your-cashmere-sweater-is-decimating-mongolias-grasslands" target="_blank" rel="noopener">How your cashmere sweater is decimating Mongolia's grasslands</a></li>
          <li>Peleg Mizrachi &amp; Sharon (2025). Secondhand fashion consumers exhibit fast fashion behaviors. <a href="https://doi.org/10.1038/s41598-025-19089-1" target="_blank" rel="noopener">Scientific Reports</a></li>
          <li>Textile Exchange (2024). <a href="https://textileexchange.org/knowledge-center/reports/materials-market-report-2024/" target="_blank" rel="noopener">Materials market report</a>; Apparel Insider. <a href="https://apparelinsider.com/use-of-rpet-by-apparel-industry-plateaus/" target="_blank" rel="noopener">Use of rPET by apparel industry plateaus</a></li>
          <li>UNEP (2019). <a href="https://www.unep.org/news-and-stories/press-release/180-million-investment-tackle-hidden-cost-gold" target="_blank" rel="noopener">$180 million investment to tackle hidden cost of gold</a></li>
        </ul>
      </div>

      <button class="btn full" id="again" type="button">Build another outfit</button>`;
  }
  $('#result-body').addEventListener('click', e => {
    if (e.target.id !== 'again') return;
    S = fresh(); renderBuild(); show('build');
  });

  /* ---------- boot ---------- */
  function start(data){
    if (data && data.S && Array.isArray(data.S.picks) && data.S.picks.length === STEPS.length) S = data.S;
    S.q = S.q || ''; S.view = S.view || 'grid';
    const allDone = S.picks.every(complete);
    if (S.screen === 'guess' && allDone) { renderGuess(); show('guess'); }
    else if (S.screen === 'result' && allDone) { renderResult(); show('result'); }
    else { S.screen = 'build'; renderBuild(); show('build'); }
  }
  start({});
})();
</script>
</body>
</html>
